version: "3.8"

services:
  ml-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_inference_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - WORKERS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
